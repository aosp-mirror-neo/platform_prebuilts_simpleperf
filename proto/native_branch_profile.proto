// The branch list file format is generated by the inject command. The new format is:
// struct BranchListFile {
//   char magic[28] = "AndroidNativeBranchProfile";
//   uint32 version = 1;
//   uint8 compressed;  // 1 if compressed, otherwise 0
//   struct {
//      uint32 msg_size;
//      message NativeBranchProfile msg;
//   } msgs[];
// };
//

syntax = "proto3";

package simpleperf.proto;

// Top-level container for a collection of binary profiles.
message NativeBranchProfile {
  enum TraceSource {
    SOURCE_UNKNOWN = 0;
    SOURCE_ARM_ETE = 1;
    SOURCE_ARM_BRBE = 2;
    SOURCE_ARM_SPE = 3;
    SOURCE_X86_LBR = 4;
  }
  TraceSource source = 1;

  // List of binaries referenced by index in other messages.
  // Index 0 is reserved for 'unknown' binary.
  repeated BinaryInfo binaries = 2;

  // List of branch edges (LBR/BRBE/SPE data).
  repeated BranchEdges branch_edges = 3;

  // List of branch sequences (ETE data).
  repeated BranchSequences branch_sequences = 4;

  // List of instruction samples (Intel LBR, ARM BRBE, or ARM SPE).
  repeated InstructionSamples instruction_samples = 5;

  // The address type shows whether the addresses in the file (e.g. in
  // BranchSequences, BranchEdges, InstructionSamples) are file offsets
  // or file virtual addresses.
  enum AddrType {
    FILE_VADDR = 0;
    FILE_OFFSET = 1;
  }
  AddrType addr_type = 6;
}

message BinaryInfo {
  // Path to the binary file.
  string path = 1;
  // Build ID of the binary.
  string build_id = 2;

  oneof type {
    AppBinary app = 3;
    SystemBinary system = 4;
    KernelBinary kernel = 5;
    KernelModule kernel_module = 6;
  }
}

message AppBinary {
  string package_name = 1;
  uint64 version_code = 2;
  string abi = 3;
}

message SystemBinary {
  message ApexInfo {
    string module_name = 1;
    uint64 version_code = 2;
  }
  ApexInfo apex_info = 1;
  string system_fingerprint = 2;
  string vendor_fingerprint = 3;
}

message KernelBinary {
  uint64 kernel_start_addr = 1;
}

message KernelModule {
  uint64 memory_start = 1;
  uint64 memory_end = 2;
}

// This encodes the instruction samples (without branches) generated using
// Intel LBR or ARM BRBE, and not-taken conditional branch samples generated
// using ARM SPE.
message InstructionSamples {
  message Instruction {
    // Index into NativeBranchProfile.binaries.
    uint32 binary_idx = 1;
    uint64 addr = 2;
    uint64 execution_count = 3;
    // True for not-taken branch ARM SPE samples.
    bool branch_not_taken = 4;
  }
  repeated Instruction instructions = 1;
}

// This encodes the data generated using Intel LBR, ARM BRBE, or ARM SPE.
// Each BranchEdges message is one branch stack, recorded execution_count times.
// For SOURCE_ARM_SPE, each BranchEdges message contains a single Edge from a
// retired taken branch instruction (from_addr -> to_addr).
message BranchEdges {
  message Edge {
    // Index into NativeBranchProfile.binaries.
    uint32 from_binary_idx = 1;
    uint64 from_addr = 2;
    // Index into NativeBranchProfile.binaries.
    uint32 to_binary_idx = 3;
    uint64 to_addr = 4;
    reserved 5;
    reserved "execution_count";
  }
  repeated Edge edges = 1;
  // The number of times this branch stack was recorded.
  uint64 execution_count = 2;
}

// This encodes the data generated using ARM ETE.
// Each BranchSequences message contains branch data for a single binary.
message BranchSequences {
  // Index into NativeBranchProfile.binaries.
  uint32 binary_idx = 1;
  repeated Entry entries = 2;

  message Entry {
    uint64 addr = 1;
    repeated Sequence sequences = 2;
  }

  message Sequence {
    // Each bit in branches represents a branch: 0 for not taken, 1 for taken.
    // Bit 0 comes first, bit 7 comes last.
    bytes branches = 1;
    uint32 branch_size = 2;
    uint64 execution_count = 3;
  }
}
